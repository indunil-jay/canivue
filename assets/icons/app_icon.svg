<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082825"/>
      <stop offset="50%" stop-color="#0D4B45"/>
      <stop offset="100%" stop-color="#07221F"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0F766E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#061C1A" stop-opacity="0"/>
    </radialGradient>

    <!-- Canine Primary Gradient -->
    <linearGradient id="dogBodyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2FAF8"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>

    <!-- Ear & Accent Gradient -->
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Vitals / Intelligence Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#2DD4BF" flood-opacity="0.6"/>
    </filter>

    <!-- Corner Highlight Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#14B8A6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" rx="228" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#ambientGlow)"/>
  
  <!-- Subtle Sleek Border -->
  <rect width="1020" height="1020" x="2" y="2" rx="226" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Centered Iconic Group -->
  <g filter="url(#glowShadow)" transform="translate(0, -10)">
    <!-- Canine Modern Silhouette (Geometric Minimalist) -->
    <!-- Left / Back Head Arc & Body Flow -->
    <path d="M 330,730 
             C 320,640 335,530 380,440
             C 415,370 470,300 480,240
             C 485,210 495,190 515,190
             C 535,190 545,215 540,260
             C 532,320 545,360 580,380
             L 660,425
             C 715,455 750,495 750,540
             C 750,590 710,610 650,610
             L 575,610
             C 540,610 510,635 490,665
             L 445,730 Z" 
          fill="url(#dogBodyGrad)"/>

    <!-- Ear Inner Facet (adds 3D modern geometric feel) -->
    <path d="M 495,225 
             C 505,280 485,340 435,395 
             C 425,370 420,335 435,295 
             C 455,250 480,225 495,225 Z" 
          fill="url(#tealAccent)" 
          opacity="0.9"/>

    <!-- Snout / Nose Detail Accent -->
    <path d="M 725,510 
             C 750,525 750,555 725,565 
             C 710,570 690,560 690,540 
             C 690,520 710,505 725,510 Z" 
          fill="#0D5C54"/>

    <!-- Intelligent Eye (Confidence & Alertness) -->
    <circle cx="560" cy="455" r="14" fill="#0D5C54"/>
    <circle cx="563" cy="452" r="5" fill="#5EEAD4"/>

    <!-- Dynamic "V" Collar / Biometric Wave Foundation -->
    <!-- Glowing Vital / Telemetry Pulse intersecting into the letter 'V' -->
    <path d="M 230,640 
             L 340,640 
             L 375,600 
             L 415,690 
             L 460,560 
             L 505,745 
             L 555,620 
             L 590,660 
             L 640,640 
             L 790,640" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#pulseGlow)"/>

    <!-- Biometric Vital Nodes (Pulsing sensor points) -->
    <circle cx="505" cy="745" r="16" fill="#FFFFFF"/>
    <circle cx="505" cy="745" r="9" fill="#6366F1"/>

    <circle cx="460" cy="560" r="14" fill="#FFFFFF"/>
    <circle cx="460" cy="560" r="8" fill="#2DD4BF"/>
  </g>

  <!-- Modern Brand Monogram Accent: "CANIVUE" at base -->
  <text x="512" y="865" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="800" 
        font-size="64" 
        letter-spacing="14" 
        fill="#A7F3D0" 
        opacity="0.95">CANIVUE</text>

  <!-- Health Vision Micro Dot -->
  <circle cx="752" cy="850" r="8" fill="#38BDF8"/>
</svg>
