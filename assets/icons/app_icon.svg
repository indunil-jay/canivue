<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep Obsidian Liquid Space Background -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D14"/>
      <stop offset="45%" stop-color="#071924"/>
      <stop offset="100%" stop-color="#02080D"/>
    </linearGradient>

    <!-- Liquid Glass Aurora Ambient Glow 1 (Electric Cyan) -->
    <radialGradient id="cyanAurora" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#00D2C4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#040D14" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Glass Aurora Ambient Glow 2 (Royal Violet) -->
    <radialGradient id="violetAurora" cx="75%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#040D14" stop-opacity="0"/>
    </radialGradient>

    <!-- Frosted Glass Card Fill Gradient -->
    <linearGradient id="frostedGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#00F2FE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Iridescent Prismatic Border Refraction -->
    <linearGradient id="prismaticBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="65%" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.80"/>
    </linearGradient>

    <!-- Canine Body Frosted Pearl Gradient -->
    <linearGradient id="caninePearl" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2FAF8"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <!-- Ear Aurora Gradient -->
    <linearGradient id="earAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- High-Voltage Biometric Telemetry Wave Gradient -->
    <linearGradient id="telemetryPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="35%" stop-color="#00D2C4"/>
      <stop offset="65%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Soft Depth Filter for Liquid Glass -->
    <filter id="glassDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="32" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Neon Glow Filter for Pulse Line -->
    <filter id="neonPulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00F2FE" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Liquid Space Background -->
  <rect width="1024" height="1024" rx="230" fill="url(#cosmicBg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#cyanAurora)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#violetAurora)"/>

  <!-- Frosted Liquid Glass Card Base -->
  <rect width="1016" height="1016" x="4" y="4" rx="226" fill="url(#frostedGlass)"/>
  <rect width="1016" height="1016" x="4" y="4" rx="226" fill="none" stroke="url(#prismaticBorder)" stroke-width="6"/>

  <!-- Central Hero Group -->
  <g filter="url(#glassDepth)" transform="translate(0, -12)">
    <!-- Canine Modern Geometric Silhouette -->
    <path d="M 330,730 
             C 320,640 335,530 380,440
             C 415,370 470,300 480,240
             C 485,210 495,190 515,190
             C 535,190 545,215 540,260
             C 532,320 545,360 580,380
             L 660,425
             C 715,455 750,495 750,540
             C 750,590 710,610 650,610
             L 575,610
             C 540,610 510,635 490,665
             L 445,730 Z" 
          fill="url(#caninePearl)"/>

    <!-- Ear Iridescent Facet -->
    <path d="M 495,225 
             C 505,280 485,340 435,395 
             C 425,370 420,335 435,295 
             C 455,250 480,225 495,225 Z" 
          fill="url(#earAurora)"/>

    <!-- Snout Nose -->
    <path d="M 725,510 
             C 750,525 750,555 725,565 
             C 710,570 690,560 690,540 
             C 690,520 710,505 725,510 Z" 
          fill="#072322"/>

    <!-- Intelligent Eye -->
    <circle cx="560" cy="455" r="14" fill="#0A3331"/>
    <circle cx="563" cy="452" r="5" fill="#00F2FE"/>

    <!-- Biometric Telemetry Pulse Wave ("Vue") -->
    <path d="M 220,640 
             L 330,640 
             L 370,595 
             L 415,690 
             L 460,550 
             L 510,750 
             L 560,615 
             L 595,660 
             L 645,640 
             L 800,640" 
          fill="none" 
          stroke="url(#telemetryPulse)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonPulseGlow)"/>

    <!-- Biometric Vital Peak Node -->
    <circle cx="510" cy="750" r="17" fill="#FFFFFF"/>
    <circle cx="510" cy="750" r="10" fill="#8B5CF6"/>

    <circle cx="460" cy="550" r="14" fill="#FFFFFF"/>
    <circle cx="460" cy="550" r="8" fill="#00F2FE"/>
  </g>

  <!-- Modern Brand Monogram -->
  <text x="512" y="865" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
        font-weight="800" 
        font-size="64" 
        letter-spacing="14" 
        fill="#E2FAF8" 
        opacity="0.96">CANIVUE</text>

  <!-- Health Telemetry Glowing Dot -->
  <circle cx="752" cy="850" r="8" fill="#00F2FE"/>
</svg>
